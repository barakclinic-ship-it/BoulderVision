<link rel="manifest" id="manifestLink" href="">
<style>
  :root{
    --orange:#0DB2FD;
    --orange-dim:#0DB2FD55;
    --bg:#0a0a0a;
    --panel:#141414;
    --panel2:#1c1c1c;
    --line:#2a2a2a;
    --text:#f2f2f2;
    --sub:#9a9a9a;
    --white:#f5f5f5;
    --danger:#ff3b3b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    overscroll-behavior:none; height:100%;}
  #app{display:flex; flex-direction:column; height:100vh; height:100dvh;}

  header{display:flex; align-items:center; gap:10px; padding:14px 16px;
    border-bottom:1px solid var(--line); flex-shrink:0;}
  .logo{width:32px; height:32px; flex-shrink:0; border-radius:8px; object-fit:cover;}
  header h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px;}
  header .tag{font-size:11px; color:var(--sub); margin-inline-start:auto;}
  #shareBtn{width:32px; height:32px; border-radius:50%; background:var(--panel2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    flex-shrink:0;}

  #stage{position:relative; flex:1; min-height:0; background:#000; overflow:hidden;}
  video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  canvas#overlay{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}

  @media (min-width:820px){
    video, canvas#overlay{ object-fit:contain; }
  }
  video.mirrored, canvas#overlay.mirrored{transform:scaleX(-1);}

  #hint{position:absolute; top:12px; left:0; right:0; text-align:center;
    color:var(--sub); font-size:13px; pointer-events:none; padding:0 20px;}

  #status{position:absolute; top:12px; inset-inline-start:12px; display:flex;
    align-items:center; gap:6px; background:#00000090; padding:6px 10px;
    border-radius:20px; font-size:12px; color:var(--sub);}
  #status .dot{width:8px; height:8px; border-radius:50%; background:var(--sub);}
  #status.live .dot{background:var(--orange); box-shadow:0 0 8px var(--orange);
    animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{opacity:1} 50%{opacity:.4}}

  #timer{position:absolute; top:12px; inset-inline-end:12px; background:#00000090;
    padding:6px 12px; border-radius:20px; font-size:13px; font-variant-numeric:tabular-nums;
    display:none;}
  #timer.show{display:block;}

  #controls{flex-shrink:0; padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:center; gap:14px; background:var(--panel);
    border-top:1px solid var(--line); position:relative;}
  #uploadBtn{width:46px; height:46px; border-radius:50%; background:var(--panel2);
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    position:absolute; inset-inline-start:16px;}
  #uploadBtn:disabled{opacity:.4;}
  .controls-spacer{width:46px; flex-shrink:0;}

  #progressWrap{position:absolute; bottom:0; left:0; right:0; height:3px;
    background:#00000060; display:none;}
  #progressWrap.show{display:block;}
  #progressBar{height:100%; width:0%; background:var(--orange); transition:width .1s linear;}
  button{font-family:inherit; border:none; cursor:pointer;}
  #recordBtn{width:76px; height:76px; border-radius:50%; background:var(--orange);
    display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 4px #ffffff12;}
  #recordBtn .inner{width:28px; height:28px; border-radius:8px; background:#000;
    transition:.2s;}
  #recordBtn.recording .inner{border-radius:6px; width:24px; height:24px; background:#000;}
  #recordBtn:disabled{opacity:.4;}

  #resultsWrap{position:absolute; inset:0; background:var(--bg); overflow-y:auto;
    display:none; padding-bottom:24px;}
  #resultsWrap.show{display:block;}
  #resultsHeader{display:flex; align-items:center; gap:10px; padding:14px 16px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5;}
  #resultsHeader h2{font-size:16px; margin:0;}
  #closeResults{margin-inline-start:auto; background:var(--panel2); color:var(--text);
    border-radius:16px; padding:7px 14px; font-size:13px;}

  #replayBox{position:relative; background:#000; margin:14px 16px 0; border-radius:14px;
    overflow:hidden; aspect-ratio:9/16; max-height:38vh;}
  #replayBox canvas, #replayBox video{position:absolute; inset:0; width:100%; height:100%; object-fit:contain;}
  #replayBadge{position:absolute; top:10px; inset-inline-start:10px; background:var(--danger);
    color:#fff; font-size:11px; font-weight:700; padding:3px 9px; border-radius:10px;
    display:none;}
  #replayBadge.show{display:block;}

  #scrubRow{display:flex; align-items:center; gap:10px; margin:8px 16px 0;}
  #scrubPlayBtn{width:34px; height:34px; border-radius:50%; background:var(--orange);
    display:flex; align-items:center; justify-content:center; flex-shrink:0; border:none;}
  #scrubSlider{flex:1; -webkit-appearance:none; height:4px; border-radius:2px;
    background:var(--line); outline:none;}
  #scrubSlider::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px;
    border-radius:50%; background:var(--orange); cursor:pointer;}
  #scrubTime{font-size:11.5px; color:var(--sub); font-variant-numeric:tabular-nums;
    flex-shrink:0; min-width:34px; text-align:end;}

  .score-row{display:flex; gap:10px; padding:16px;}
  .score-card{flex:1; background:var(--panel2); border-radius:14px; padding:14px;
    text-align:center; border:1px solid var(--line);}
  .score-card .big{font-size:26px; font-weight:800; color:var(--orange);}
  .score-card .lbl{font-size:11px; color:var(--sub); margin-top:2px;}

  #holdsList{padding:0 16px;}
  #holdsList h3{font-size:13px; color:var(--sub); font-weight:600; margin:14px 0 8px;
    text-transform:none;}
  .hold-item{display:flex; align-items:center; gap:12px; background:var(--panel2);
    border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:8px;}
  .hold-num{width:26px; height:26px; border-radius:50%; background:var(--orange);
    color:#000; font-weight:800; font-size:13px; display:flex; align-items:center;
    justify-content:center; flex-shrink:0;}
  .hold-info{flex:1; min-width:0;}
  .hold-info .t1{font-size:13.5px; font-weight:600;}
  .hold-info .t2{font-size:11.5px; color:var(--sub); margin-top:1px;}
  .stability-bar{width:56px; height:5px; border-radius:3px; background:var(--line);
    overflow:hidden; flex-shrink:0;}
  .stability-bar .fill{height:100%; background:var(--orange);}

  #fallNote{margin:4px 16px 0; background:#2a1010; border:1px solid #4a1818;
    color:#ff8080; border-radius:12px; padding:11px 13px; font-size:13px; display:none;}
  #fallNote.show{display:block;}

  #colorHoldsNote{margin:4px 16px 0; background:var(--panel2); border:1px solid var(--line);
    color:var(--sub); border-radius:12px; padding:11px 13px; font-size:12.5px; line-height:1.5;
    display:none;}
  #colorHoldsNote.show{display:block;}

  #retryBtn{display:block; width:calc(100% - 32px); margin:18px 16px 0; padding:13px;
    background:var(--orange); color:#000; font-weight:700; font-size:14.5px;
    border-radius:12px;}

  .empty-note{padding:40px 20px; text-align:center; color:var(--sub); font-size:13.5px;
    line-height:1.6;}
</style>
</head>

<script type="module">

// buffer of {t, landmarks}
let buffer = [];
let fallDetected = false;
let fallFrameIndex = -1;

// tracked points for hold/trajectory logic (indices into MediaPipe Pose landmarks)
const L = { LW:15, RW:16, LA:27, RA:28, LH:23, RH:24, LS:11, RS:12 };

// per-limb still-tracking state, used only while recording
let stillState = {};
const LIMB_KEYS = ['LW','RW','LA','RA'];

function resetStillState(){
  stillState = {};
  LIMB_KEYS.forEach(k => stillState[k] = { stillSince:null, active:false, path:[] });
}

const STILL_SPEED_THRESH = 0.012;   // normalized coords / sec
const STILL_MIN_DURATION = 0.55;    // seconds to count as a hold
const FALL_VEL_THRESH = 0.9;        // normalized units/sec downward, hips
const FALL_MIN_GAP = 1.2;           // seconds between fall checks after trigger

let holds = []; // { limb, start, end, points:[{x,y,t}] }

function holdCentroid(h){
  let x=0,y=0;
  h.points.forEach(p=>{x+=p.x; y+=p.y;});
  return { x:x/h.points.length, y:y/h.points.length };
}

// draws a numbered marker at each hold's contact point (where hand/foot paused) — not color-based
function drawContactMarkers(ctx, holdsList, w, h, opts={}){
  holdsList.forEach((hh, i)=>{
    const c = holdCentroid(hh);
    const cx = c.x*w, cy = c.y*h;
    ctx.beginPath();
    ctx.arc(cx, cy, opts.r || 12, 0, Math.PI*2);
    ctx.strokeStyle = opts.color || 'rgba(13,178,253,0.9)';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = opts.textColor || 'rgba(13,178,253,0.95)';
    ctx.font = `${opts.fontSize || 11}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(i+1), cx, cy);
  });
}

let wallBlobs = []; // all detected colorful/triangular features on the wall, from one reference frame

function detectColorBlobs(sourceEl, fullW, fullH){
  if(!fullW || !fullH) return [];
  const DW = 110;
  const DH = Math.max(1, Math.round(DW * fullH / fullW));
  const tmp = document.createElement('canvas');
  tmp.width = DW; tmp.height = DH;
  const tctx = tmp.getContext('2d', {willReadFrequently:true});
  let data;
  try{
    tctx.drawImage(sourceEl, 0, 0, DW, DH);
    data = tctx.getImageData(0, 0, DW, DH).data;
  }catch(e){ return []; }

  const mask = new Uint8Array(DW*DH);
  for(let i=0;i<DW*DH;i++){
    const r=data[i*4], g=data[i*4+1], b=data[i*4+2];
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const v = max/255, s = max===0 ? 0 : (max-min)/max;
    if(s > 0.40 && v > 0.25 && v < 0.98) mask[i] = 1;
  }

  const visited = new Uint8Array(DW*DH);
  const blobs = [];
  for(let y=0;y<DH;y++){
    for(let x=0;x<DW;x++){
      const idx = y*DW+x;
      if(!mask[idx] || visited[idx]) continue;
      const stack = [idx];
      visited[idx] = 1;
      let minX=x,maxX=x,minY=y,maxY=y,count=0,sr=0,sg=0,sb=0;
      while(stack.length){
        const cur = stack.pop();
        const cx = cur % DW, cy = (cur / DW) | 0;
        count++; sr+=data[cur*4]; sg+=data[cur*4+1]; sb+=data[cur*4+2];
        if(cx<minX)minX=cx; if(cx>maxX)maxX=cx;
        if(cy<minY)minY=cy; if(cy>maxY)maxY=cy;
        if(cx>0 && mask[cur-1] && !visited[cur-1]){ visited[cur-1]=1; stack.push(cur-1); }
        if(cx<DW-1 && mask[cur+1] && !visited[cur+1]){ visited[cur+1]=1; stack.push(cur+1); }
        if(cur-DW>=0 && mask[cur-DW] && !visited[cur-DW]){ visited[cur-DW]=1; stack.push(cur-DW); }
        if(cur+DW<DW*DH && mask[cur+DW] && !visited[cur+DW]){ visited[cur+DW]=1; stack.push(cur+DW); }
      }
      if(count >= 3){
        const bw = maxX-minX+1, bh = maxY-minY+1;
        const fillRatio = count/(bw*bh);
        const shape = (fillRatio >= 0.38 && fillRatio <= 0.63) ? 'triangleish' : 'blob';
        blobs.push({
          x:(minX+maxX)/2/DW, y:(minY+maxY)/2/DH,
          w:bw/DW, h:bh/DH,
          r:Math.round(sr/count), g:Math.round(sg/count), b:Math.round(sb/count),
          area:count, shape
        });
      }
    }
  }
  blobs.sort((a,b)=>b.area-a.area);
  return blobs.slice(0, 60);
}

// after a climb: find which wall blobs were actually touched, then flag other blobs
// with a closely matching color as likely-same-route holds too
function matchWallFeatures(){
  const touched = new Set();
  holds.forEach(hh=>{
    const c = holdCentroid(hh);
    let best=-1, bestDist=Infinity;
    wallBlobs.forEach((b,i)=>{
      const d = Math.hypot(b.x-c.x, b.y-c.y);
      if(d < bestDist){ bestDist=d; best=i; }
    });
    if(best>=0 && bestDist < 0.07) touched.add(best);
  });
  const sameColor = new Set();
  touched.forEach(ti=>{
    const tb = wallBlobs[ti];
    wallBlobs.forEach((b,i)=>{
      if(touched.has(i) || sameColor.has(i)) return;
      const colorDist = Math.sqrt((b.r-tb.r)**2 + (b.g-tb.g)**2 + (b.b-tb.b)**2);
      if(colorDist < 38) sameColor.add(i);
    });
  });
  return { touched, sameColor };
}

// draws wall features: confirmed touches (solid), same-color matches (dashed),
// and any triangular-shaped feature regardless of touch/color (dashed, dimmer)
function drawWallFeatures(ctx, blobs, touched, sameColor, w, h){
  blobs.forEach((b,i)=>{
    const isTouched = touched.has(i);
    const isSame = sameColor.has(i);
    const isTri = b.shape === 'triangleish';
    if(!isTouched && !isSame && !isTri) return;

    const cx = b.x*w, cy = b.y*h;
    const rad = Math.max(9, Math.min(w,h) * Math.max(b.w,b.h) * 0.55);
    ctx.beginPath();
    if(isTri){
      ctx.moveTo(cx, cy-rad);
      ctx.lineTo(cx-rad*0.87, cy+rad*0.5);
      ctx.lineTo(cx+rad*0.87, cy+rad*0.5);
      ctx.closePath();
    } else {
      ctx.arc(cx, cy, rad, 0, Math.PI*2);
    }
    let opacity = 0.4, dash = [3,4], lineWidth = 1.6;
    if(isTouched){ opacity = 1; dash = []; lineWidth = 2.5; }
    else if(isSame){ opacity = 0.75; dash = [2,3]; lineWidth = 2; }
    ctx.setLineDash(dash);
    ctx.strokeStyle = `rgba(${b.r},${b.g},${b.b},${opacity})`;
    ctx.lineWidth = lineWidth;
    ctx.stroke();
    ctx.setLineDash([]);
  });
}

const TRAJ_IDS = [0,11,12,13,14,15,16,23,24,25,26,27,28]; // head, shoulders, elbows, wrists, hips, knees, ankles
let jointTrajectories = {}; // id -> [{x,y,t}]
function resetTrajectories(){
  jointTrajectories = {};
  TRAJ_IDS.forEach(id => jointTrajectories[id] = []);
}

const CONNECTIONS = [
  [11,12],[11,23],[12,24],[23,24],
  [11,13],[13,15],[12,14],[14,16],
  [23,25],[25,27],[24,26],[26,28],
  [27,31],[28,32],
  [15,17],[15,19],[16,18],[16,20]
];
const CHIP_IDS = [15,16,27,28,23,24,11,12,13,14,25,26];

function drawSkeleton(ctx, lm, w, h, opts={}){
  ctx.strokeStyle = opts.boneColor || 'rgba(245,245,245,0.95)';
  ctx.lineWidth = opts.lineWidth || 3.5;
  ctx.lineCap = 'round';
  CONNECTIONS.forEach(([a,b])=>{
    const pa = lm[a], pb = lm[b];
    if(!pa || !pb) return;
    ctx.beginPath();
    ctx.moveTo(pa.x*w, pa.y*h);
    ctx.lineTo(pb.x*w, pb.y*h);
    ctx.stroke();
  });
  CHIP_IDS.forEach(id=>{
    const p = lm[id];
    if(!p) return;
    ctx.beginPath();
    ctx.arc(p.x*w, p.y*h, opts.chipR || 5, 0, Math.PI*2);
    ctx.fillStyle = '#f5f5f5';
    ctx.fill();
  });
}

function drawHighlightRing(ctx, p, w, h, color){
  ctx.beginPath();
  ctx.arc(p.x*w, p.y*h, 11, 0, Math.PI*2);
  ctx.strokeStyle = color;
  ctx.lineWidth = 2.5;
  ctx.stroke();
}

function drawTrajectory(ctx, pts, w, h, opts={}){
  if(pts.length < 2) return;
  ctx.beginPath();
  ctx.setLineDash([2,7]);
  ctx.strokeStyle = opts.color || 'rgba(13,178,253,0.5)';
  ctx.lineWidth = opts.lineWidth || 1.6;
  pts.forEach((p,i)=>{
    const x = p.x*w, y = p.y*h;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  });
  ctx.stroke();
  ctx.setLineDash([]);

  // chip dots along the path, sampled at a fixed time interval
  const chipGap = opts.chipGapSeconds || 0.35;
  let lastChipT = pts[0].t;
  ctx.fillStyle = opts.chipColor || 'rgba(13,178,253,0.8)';
  pts.forEach(p=>{
    if(p.t - lastChipT >= chipGap){
      ctx.beginPath();
      ctx.arc(p.x*w, p.y*h, opts.chipDotR || 2, 0, Math.PI*2);
      ctx.fill();
      lastChipT = p.t;
    }
  });
}

function drawAllTrajectories(ctx, trajMap, w, h, opts={}){
  TRAJ_IDS.forEach(id=>{
    const pts = trajMap[id];
    if(pts && pts.length > 1) drawTrajectory(ctx, pts, w, h, opts);
  });
}

function centerOfMass(lm){
  const ids = [11,12,23,24];
  let x=0,y=0,n=0;
  ids.forEach(id=>{ if(lm[id]){ x+=lm[id].x; y+=lm[id].y; n++; } });
  return n? {x:x/n, y:y/n} : null;
}

function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }

let lastCOM = null;
let lastCOMTime = 0;
let lastFallCheckTime = 0;

function processFrame(lm, t){
  // per-joint trajectory: head, shoulders, elbows, wrists, hips, knees, ankles
  TRAJ_IDS.forEach(id=>{
    const p = lm[id];
    if(p) jointTrajectories[id].push({x:p.x, y:p.y, t});
  });

  // fall detection via vertical velocity of hip/shoulder center (not drawn)
  const com = centerOfMass(lm);
  if(com){
    if(lastCOM && (t - lastCOMTime) > 0){
      const vy = (com.y - lastCOM.y) / (t - lastCOMTime);
      if(vy > FALL_VEL_THRESH && !fallDetected && (t - lastFallCheckTime) > FALL_MIN_GAP){
        fallDetected = true;
        fallFrameIndex = buffer.length;
        lastFallCheckTime = t;
      }
    }
    lastCOM = com;
    lastCOMTime = t;
  }

  // still / hold detection per limb
  LIMB_KEYS.forEach(key=>{
    const idx = L[key];
    const p = lm[idx];
    const st = stillState[key];
    if(!p || !st) return;
    st.path.push({x:p.x, y:p.y, t});
    // keep last ~0.4s of samples to measure speed
    while(st.path.length > 2 && t - st.path[0].t > 0.4) st.path.shift();
    let speed = 0;
    if(st.path.length >= 2){
      const a = st.path[0], b = st.path[st.path.length-1];
      const dt = b.t - a.t;
      if(dt > 0) speed = dist(a,b)/dt;
    }
    if(speed < STILL_SPEED_THRESH){
      if(st.stillSince === null) st.stillSince = t;
      if(!st.active && (t - st.stillSince) >= STILL_MIN_DURATION){
        st.active = true;
        st.holdStart = st.stillSince;
        st.holdPoints = [{x:p.x,y:p.y,t}];
      } else if(st.active){
        st.holdPoints.push({x:p.x,y:p.y,t});
      }
    } else {
      if(st.active){
        // close out the hold
        holds.push({
          limb:key, start:st.holdStart, end:t, points: st.holdPoints
        });
      }
      st.stillSince = null;
      st.active = false;
      st.holdPoints = [];
    }
  });
}

function finalizeOpenHolds(t){
  LIMB_KEYS.forEach(key=>{
    const st = stillState[key];
    if(st && st.active){
      holds.push({ limb:key, start:st.holdStart, end:t, points: st.holdPoints });
    }
  });
}

function loop(){
  if(!running) return;
  if(landmarker && video.readyState >= 2){
    try{
      const result = landmarker.detectForVideo(video, performance.now());
      octx.clearRect(0,0,overlay.width, overlay.height);
      drawWallFeatures(octx, wallBlobs, new Set(), new Set(), overlay.width, overlay.height);
      drawContactMarkers(octx, holds, overlay.width, overlay.height);
      if(result.landmarks && result.landmarks[0]){
        const lm = result.landmarks[0];
        drawSkeleton(octx, lm, overlay.width, overlay.height);

        if(recording){
          const t = performance.now()/1000 - recordStart;
          buffer.push({t, lm});
          processFrame(lm, t);

          // draw per-joint trajectories + still-ring highlights live
          drawAllTrajectories(octx, jointTrajectories, overlay.width, overlay.height);
          LIMB_KEYS.forEach(key=>{
            const st = stillState[key];
            if(st && st.active){
              const p = lm[L[key]];
              if(p) drawHighlightRing(octx, p, overlay.width, overlay.height, '#0DB2FD');
            }
          });

          if(fallDetected && fallFrameIndex === buffer.length - 1){
            stopRecording(true);
          }
          timerEl.textContent = formatTime(t);
        }
      }
    }catch(err){
      console.warn('live frame error', err);
    }
  }
  rafId = requestAnimationFrame(loop);
}

function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const ss = Math.floor(s%60).toString().padStart(2,'0');
  return `${m}:${ss}`;
}

function pickRecorderMime(){
  const candidates = ['video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  for(const c of candidates){
    if(window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
  }
  return '';
}

function startRecording(){
  buffer = [];
  holds = [];
  resetTrajectories();
  fallDetected = false;
  fallFrameIndex = -1;
  lastCOM = null;
  resetStillState();
  wallBlobs = detectColorBlobs(video, overlay.width, overlay.height);
  recordStart = performance.now()/1000;
  recording = true;
  recordBtn.classList.add('recording');
  statusBox.classList.add('live');
  statusText.textContent = 'מקליט';
  timerEl.classList.add('show');
  hint.style.display = 'none';

  recordedChunks = [];
  try{
    const mime = pickRecorderMime();
    mediaRecorder = new MediaRecorder(cameraStream, mime ? {mimeType: mime} : undefined);
    mediaRecorder.ondataavailable = e => { if(e.data && e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.start();
  }catch(e){
    mediaRecorder = null;
    console.warn('recording capture unavailable', e);
  }
}

async function stopRecording(auto=false){
  if(!recording) return;
  recording = false;
  const t = performance.now()/1000 - recordStart;
  finalizeOpenHolds(t);
  recordBtn.classList.remove('recording');
  statusBox.classList.remove('live');
  statusText.textContent = 'מעבד...';
  timerEl.classList.remove('show');

  if(analyzedVideoURL){ URL.revokeObjectURL(analyzedVideoURL); analyzedVideoURL = null; }

  if(mediaRecorder && mediaRecorder.state !== 'inactive'){
    await new Promise(resolve=>{
      mediaRecorder.onstop = resolve;
      try{ mediaRecorder.stop(); }catch(e){ resolve(); }
    });
    if(recordedChunks.length){
      const blob = new Blob(recordedChunks, {type: recordedChunks[0].type || 'video/webm'});
      analyzedVideoURL = URL.createObjectURL(blob);
    }
  }

  statusText.textContent = 'מוכן';
  showResults(t);
}

recordBtn.addEventListener('click', ()=>{
  if(!recording) startRecording();
  else stopRecording(false);
});

uploadBtn.addEventListener('click', ()=>{

async function analyzeUploadedFile(file){
  running = false;
  if(rafId) cancelAnimationFrame(rafId);
  analyzing = true;
  recordBtn.disabled = true;
  uploadBtn.disabled = true;
  hint.style.display = 'none';
  progressWrap.classList.add('show');
  statusBox.classList.add('live');
  statusText.textContent = 'טוען סרטון...';

  if(analyzedVideoURL){ URL.revokeObjectURL(analyzedVideoURL); analyzedVideoURL = null; }
  const url = URL.createObjectURL(file);
  video.srcObject = null;
  video.src = url;

  await new Promise(res=>{ video.onloadedmetadata = res; });
  resizeCanvas();

  buffer = []; holds = []; resetTrajectories();
  fallDetected = false; fallFrameIndex = -1;
  lastCOM = null; lastCOMTime = 0; lastFallCheckTime = 0;
  resetStillState();

  const duration = video.duration || 0;
  statusText.textContent = 'מנתח סרטון...';

  try{ await video.play(); }catch(e){}
  video.playbackRate = 4;
  await new Promise(res => requestAnimationFrame(res));
  wallBlobs = detectColorBlobs(video, overlay.width, overlay.height);

  let finished = false;

  function finalizeAnalysis(){
    if(finished) return;
    finished = true;
    const t = video.currentTime;
    finalizeOpenHolds(t);
    progressWrap.classList.remove('show');
    progressBar.style.width = '0%';
    statusBox.classList.remove('live');
    statusText.textContent = 'מוכן';

    analyzedVideoURL = url;
    video.pause();
    video.playbackRate = 1;
    video.removeEventListener('ended', finalizeAnalysis);
    video.src = '';
    video.srcObject = cameraStream;
    video.play().catch(()=>{});

    recordBtn.disabled = false;
    uploadBtn.disabled = false;
    analyzing = false;
    running = true;
    loop();

    showResults(t);
  }

  function analyzeStep(){
    if(finished) return;
    if(video.paused || video.ended){ finalizeAnalysis(); return; }
    if(video.readyState < 2){ requestAnimationFrame(analyzeStep); return; }
    const t = video.currentTime;
    try{
      const result = landmarker.detectForVideo(video, performance.now());
      octx.clearRect(0,0,overlay.width, overlay.height);
      drawWallFeatures(octx, wallBlobs, new Set(), new Set(), overlay.width, overlay.height);
      drawContactMarkers(octx, holds, overlay.width, overlay.height);
      if(result.landmarks && result.landmarks[0]){
        const lm = result.landmarks[0];
        drawSkeleton(octx, lm, overlay.width, overlay.height);
        buffer.push({t, lm});
        processFrame(lm, t);
        drawAllTrajectories(octx, jointTrajectories, overlay.width, overlay.height);
        if(fallDetected && fallFrameIndex === buffer.length - 1){
          finalizeAnalysis();
          return;
        }
      }
    }catch(err){
      console.warn('frame analysis error', err);
    }
    progressBar.style.width = `${Math.min(100, Math.round((t/(duration||1))*100))}%`;
    requestAnimationFrame(analyzeStep);
  }

  video.addEventListener('ended', finalizeAnalysis, {once:true});
  requestAnimationFrame(analyzeStep);
}

closeResults.addEventListener('click', ()=>{
  resultsWrap.classList.remove('show');
  stopReplayPlayback();
  hint.style.display = 'block';
});
retryBtn.addEventListener('click', ()=>{

  hint.style.display = 'block';
});

function stabilityScore(pts){
  // lower positional variance during hold = higher stability
  if(pts.length < 2) return 1;
  let mx=0,my=0;
  pts.forEach(p=>{mx+=p.x; my+=p.y;});
  mx/=pts.length; my/=pts.length;
  let variance=0;
  pts.forEach(p=>{ variance += (p.x-mx)**2 + (p.y-my)**2; });
  variance /= pts.length;
  const jitter = Math.sqrt(variance);
  const score = Math.max(0, Math.min(1, 1 - jitter*60));
  return score;
}

const LIMB_LABELS = { LW:'יד שמאל', RW:'יד ימין', LA:'רגל שמאל', RA:'רגל ימין' };

function verticalRangePercent(){
  if(!buffer.length) return 0;
  let minY = 1, maxY = 0;
  buffer.forEach(f=>{
    const lh = f.lm[23], rh = f.lm[24];
    if(lh && rh){
      const y = (lh.y + rh.y) / 2;
      if(y < minY) minY = y;
      if(y > maxY) maxY = y;
    }
  });
  return Math.max(0, Math.round((maxY - minY) * 100));
}

// total distance traveled by hands+feet along their tracked paths, as % of frame height —
// a direct, dry readout of how much the limbs actually moved (ties to the trajectory lines)
function totalLimbTravelPercent(){
  const limbIds = [15,16,27,28]; // wrists, ankles
  let total = 0;
  limbIds.forEach(id=>{
    const pts = jointTrajectories[id] || [];
    for(let i=1;i<pts.length;i++){
      total += dist(pts[i-1], pts[i]);
    }
  });
  return Math.round(total * 100);
}

let matchedTouched = new Set();
let matchedSameColor = new Set();

function showResults(totalDuration){
  const match = matchWallFeatures();
  matchedTouched = match.touched;
  matchedSameColor = match.sameColor;

  holdsItems.innerHTML = '';
  const sorted = holds.slice().sort((a,b)=>a.start-b.start);

  sorted.forEach((h,i)=>{
    const dur = h.end - h.start;
    const stab = stabilityScore(h.points);
    const movement = Math.round((1-stab)*100);

    const item = document.createElement('div');
    item.className = 'hold-item';
    item.innerHTML = `
      <div class="hold-num">${i+1}</div>
      <div class="hold-info">
        <div class="t1">${LIMB_LABELS[h.limb]} · ${dur.toFixed(1)} שנ'</div>
        <div class="t2">תנודתיות באחיזה: ${movement}%</div>
      </div>
      <div class="stability-bar"><div class="fill" style="width:${movement}%"></div></div>
    `;
    holdsItems.appendChild(item);
  });

  if(sorted.length === 0){
    holdsItems.innerHTML = `<div class="empty-note">לא זוהו עצירות ברורות של יד/רגל בניסיון הזה — נסו ניסיון עם עצירות ברורות יותר על כל אחיזה.</div>`;
  }

  scoreEfficiency.textContent = totalLimbTravelPercent() + '%';
  scoreHolds.textContent = sorted.length;
  scoreDuration.textContent = formatTime(totalDuration);

  const triCount = wallBlobs.filter(b=>b.shape==='triangleish').length;
  const sameColorCount = matchedSameColor.size;
  if(sorted.length || triCount){
    colorHoldsNote.classList.add('show');
    colorHoldsNote.textContent = `העיגולים הממוספרים הם המגעים בפועל של היד/רגל. קווים רציפים סביב תבנית = אחיזה שנגעת בה; קו מקווקו בצבע זהה = אחיזה אחרת באותו צבע בדיוק שכנראה שייכת לאותו מסלול (לא ודאי); כל תבנית משולשת על הקיר מסומנת גם אם לא נגעו בה ולא הותאם צבעה — כי לא ניתן לדעת קושי או שימוש בפועל, רק צורה.`;
  } else {
    colorHoldsNote.classList.remove('show');
  }

  if(fallDetected){
    fallNote.classList.add('show');
    fallNote.textContent = `זוהתה נפילה בשנייה ${buffer[fallFrameIndex] ? buffer[fallFrameIndex].t.toFixed(1) : '?'} — ההקלטה נעצרה אוטומטית.`;
  } else {
    fallNote.classList.remove('show');
  }

  resultsWrap.classList.add('show');
  startReplayPlayback();
}

const scrubPlayBtn = document.getElementById('scrubPlayBtn');
const scrubPlayIcon = document.getElementById('scrubPlayIcon');
const scrubPauseIcon = document.getElementById('scrubPauseIcon');
const scrubSlider = document.getElementById('scrubSlider');
const scrubTime = document.getElementById('scrubTime');

function findNearestFrame(t){
  if(!buffer.length) return null;
  let lo=0, hi=buffer.length-1;
  while(lo<hi){
    const mid=(lo+hi)>>1;
    if(buffer[mid].t < t) lo=mid+1; else hi=mid;
  }
  return buffer[lo];
}

function resizeReplayOverlay(){
  const w = replayBox.clientWidth * devicePixelRatio;
  const h = replayBox.clientHeight * devicePixelRatio;
  replayOverlay.width = w;
  replayOverlay.height = h;
}

function replayOverlayTick(){
  if(!resultsWrap.classList.contains('show')){ replayRafId = null; return; }
  const w = replayOverlay.width, h = replayOverlay.height;
  const rt = replayVideo.currentTime;
  rctx.clearRect(0,0,w,h);
  drawWallFeatures(rctx, wallBlobs, matchedTouched, matchedSameColor, w, h);
  const trimmed = {};
  TRAJ_IDS.forEach(id=>{ trimmed[id] = (jointTrajectories[id]||[]).filter(p=>p.t<=rt); });
  drawAllTrajectories(rctx, trimmed, w, h, {lineWidth:2});
  const activeHolds = holds.slice().sort((a,b)=>a.start-b.start).filter(hh=>hh.start<=rt);
  drawContactMarkers(rctx, activeHolds, w, h, {r:14, fontSize:13});
  const lmFrame = findNearestFrame(rt);
  if(lmFrame) drawSkeleton(rctx, lmFrame.lm, w, h, {lineWidth:4, chipR:6});

  if(fallDetected && buffer[fallFrameIndex]){
    const fallT = buffer[fallFrameIndex].t;
    if(Math.abs(rt - fallT) < 0.4) replayBadge.classList.add('show');
    else replayBadge.classList.remove('show');
  } else {
    replayBadge.classList.remove('show');
  }

  if(!scrubUserSeeking){
    const dur = replayVideo.duration || 1;
    scrubSlider.value = Math.round((rt/dur) * 1000);
  }
  scrubTime.textContent = formatTime(rt);
  scrubPlayIcon.style.display = replayVideo.paused ? 'block' : 'none';
  scrubPauseIcon.style.display = replayVideo.paused ? 'none' : 'block';

  replayRafId = requestAnimationFrame(replayOverlayTick);
}

function startReplayPlayback(){
  if(replayRafId) cancelAnimationFrame(replayRafId);
  if(!analyzedVideoURL){
    replayVideo.removeAttribute('src');
    return;
  }
  replayVideo.src = analyzedVideoURL;
  replayVideo.currentTime = 0;
  resizeReplayOverlay();
  replayVideo.play().catch(()=>{});
  replayRafId = requestAnimationFrame(replayOverlayTick);
}

function stopReplayPlayback(){
  if(replayRafId){ cancelAnimationFrame(replayRafId); replayRafId = null; }
  replayVideo.pause();
}

scrubPlayBtn.addEventListener('click', ()=>{
  if(replayVideo.paused) replayVideo.play().catch(()=>{});

const manifest = {
  name: "BoulderVision",
  short_name: "BoulderVision",
  description: "ניתוח תנועה בזמן אמת לטיפוס בולדר",
  start_url: ".",
  scope: ".",
  display: "standalone",

  theme_color: "#0DB2FD",

  ]
};
const manifestBlob = new Blob([JSON.stringify(manifest)], {type:"application/manifest+json"});
document.getElementById('manifestLink').href = URL.createObjectURL(manifestBlob);

if('serviceWorker' in navigator){
  const swCode = `
    self.addEventListener('install', e => self.skipWaiting());
    self.addEventListener('activate', e => self.clients.claim());
    self.addEventListener('fetch', e => {});
  `;
  const swBlob = new Blob([swCode], {type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(()=>{});
}

const shareBtn = document.getElementById('shareBtn');
shareBtn.addEventListener('click', async ()=>{
  const shareData = {
    title: 'BoulderVision',
    text: 'BoulderVision - ניתוח תנועה בזמן אמת לטיפוס בולדר',
    url: location.href
  };
  if(navigator.share){
    try{ await navigator.share(shareData); }catch(e){}
  } else {
    try{
      await navigator.clipboard.writeText(location.href);
      statusText.textContent = 'הקישור הועתק';
      setTimeout(()=>{ if(!recording && !analyzing) statusText.textContent = 'מוכן'; }, 1800);
    }catch(e){}
  }
});

init();
